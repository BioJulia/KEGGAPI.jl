name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  format:
    name: Code formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1'
      - uses: julia-actions/cache@v1
      # issue #33: Resolve formatting through the same environment as package tests.
      - name: Instantiate test environment
        run: julia --project=test -e 'using Pkg; Pkg.instantiate()'
      - name: Check formatting
        run: julia --project=test -e 'using Runic; Runic.main(["--check", "src/", "test/", "docs/", "benchmarking/"])'

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1'
      - uses: julia-actions/cache@v1
      - name: Configure benchmark environment
        run: |
          julia --project=benchmarking -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Run request benchmarks
        run: |
          julia --project=benchmarking benchmarking/run_benchmarks.jl \
            --only julia --output benchmarking/benchmark_ci.csv
          julia --project=benchmarking benchmarking/write_ci_results.jl \
            benchmarking/benchmark_ci.csv benchmarking/benchmark_ci.json
      - name: Record benchmark results
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: KEGGAPI request time
          tool: customSmallerIsBetter
          output-file-path: benchmarking/benchmark_ci.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          alert-threshold: '200%'
          fail-on-alert: true
          summary-always: true

  test:
    name: Test (${{ matrix.version }}; ${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    # issue #32: Codecov uses OIDC for trusted runs and tokenless uploads for forks.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - 'nightly'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v1
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        timeout-minutes: 10
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1.10' && matrix.os == 'ubuntu-latest'
      - uses: codecov/codecov-action@v7
        if: matrix.version == '1.10' && matrix.os == 'ubuntu-latest'
        with:
          use_oidc: true
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1'
      - name: Configure doc environment
        run: |
          julia --project=docs/ -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - uses: julia-actions/julia-buildpkg@v1
      - name: Validate docstrings
        run: |
          julia --project=docs -e '
            using Documenter: DocMeta, doctest
            using KEGGAPI
            DocMeta.setdocmeta!(KEGGAPI, :DocTestSetup, :(using KEGGAPI); recursive=true)
            doctest(KEGGAPI)'
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
